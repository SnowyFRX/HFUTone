name: privacy

# 面向"之后"的一道闸：仓库是公开的，登录态、cookie、个人课表一律不许进来。
# 历史里的旧东西不在这里追（改历史的代价大于收益），只保证每一次 push /
# PR 进来的内容都是干净的。判据和本地 pre-commit 用的是同一个脚本，
# 免得两套标准慢慢走岔。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 git 跟踪文件里有没有凭据
        run: python3 tools/release_check.py --git

      # 静态查「调用了没定义的名字」。2026-11-25 学习通登录报
      # name 'log' is not defined 就是这类错：语法没错、夹具也走不到。
      - name: 检查未定义的名字
        run: python3 tools/namecheck.py

      - name: 检查仓库根有没有误放的登录态文件
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and p.parts[0] in ('.git',):
                  continue
              n = p.name
              if n in {'ykt.json','cx.json','session.json','ykt-cookie.txt',
                       'courses.json','settings.json','.do-not-ship'}:
                  bad.append(str(p))
              if p.suffix == '.log':
                  bad.append(str(p))
          if bad:
              print('[失败] 工作树里出现了登录态/日志：')
              for b in bad: print('   ', b)
              sys.exit(1)
          print('[通过] 工作树无登录态文件')
          PY