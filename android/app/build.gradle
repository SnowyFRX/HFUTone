plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def webOut = layout.buildDirectory.get().asFile

// release 签名：密钥与口令在 android/keystore.properties（不入库）。
// 文件不存在时 release 包不签名（构建仍可跑，只是不能直接装）。
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.hfutone.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hfutone.app'
        minSdk 24
        targetSdk 34
        // 每次发版都要动这两个数：同版本号的两个包装在手机上完全看不出来，
        // 装没装新包就成了猜谜（2026-11-24 实际踩过：APK 里代码是新的，
        // 手机上那份是旧的，版本号一样，分不清）。
        versionCode 22
        versionName '1.4.2'
        ndk {
            // 雷电是 x86_64；真机是 arm64
            abiFilters 'x86_64', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : null
        }
    }

    // release 构建前的那道 lint 会去下载 com.android.tools.lint（几十 MB），
    // 这个工程没有 commit 的 lint baseline，断网/校园网下直接卡在解析依赖上。
    // 真要看 lint 手动跑 ./gradlew lint。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // 网页资源：构建期复制到 build/webassets/web，再作为 assets 打进 apk。
            // 不能交给 Chaquopy 的 python srcDir —— apk 里的 assets 用 open() 读不了。
            assets.srcDirs += [new File(webOut, 'webassets')]
            // 业务层直接用桌面版 src/，一份源码两边共用
            python.srcDirs = ['../../src', '../../web']
        }
    }
}

/** 把桌面版 web/ 复制成 assets/web/ */
tasks.register('copyWebAssets', Copy) {
    from rootProject.file('../web')
    into new File(webOut, 'webassets/web')
}

tasks.named('preBuild') { dependsOn 'copyWebAssets' }

/**
 * 图标必须在。踩过一次：tools/sync_android_icon.py 还没跑就 assembleRelease，
 * 出来的 apk 里 resources.arsc 只有几百字节、没有 mipmap，装上就是系统默认的
 * 绿色机器人（aapt2 dump badging 里 application icon 是空串）。
 * 宁可在构建时炸掉，也别再发一个没图标的包。
 */
tasks.register('verifyLauncherIcon') {
    def res = file('src/main/res')
    doLast {
        def need = [
                'mipmap-mdpi/ic_launcher.png',
                'mipmap-xxhdpi/ic_launcher.png',
                'mipmap-xxxhdpi/ic_launcher_foreground.png',
                'mipmap-anydpi-v26/ic_launcher.xml',
                'values/colors.xml',
        ]
        def missing = need.findAll { !new File(res, it).exists() }
        if (missing) {
            throw new GradleException(
                    "缺少启动图标资源：${missing}\n先跑：python tools/sync_android_icon.py")
        }
        // anydpi 的 adaptive-icon 必须引到真实存在的 foreground，否则安装后照样回退默认图标
        def fg = new File(res, 'mipmap-xxxhdpi/ic_launcher_foreground.png')
        if (fg.length() < 1024) {
            throw new GradleException("ic_launcher_foreground.png 只有 ${fg.length()} 字节，图标没生成好")
        }
    }
}
tasks.named('preBuild') { dependsOn 'verifyLauncherIcon' }

chaquopy {
    defaultConfig {
        // 目标 Python 与 buildPython 必须同 minor 版本
        version = '3.12'
        buildPython 'D:/DSHSYBA/Python312/python.exe'
    }
}

dependencies {
}
